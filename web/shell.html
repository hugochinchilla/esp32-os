<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinchilla</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The canvas is the monitor: the whole page. The program draws the 4:3
     picture in the middle of it, as it does in a window of any size. */
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  /* Switched off: browsers play no sound on a page nobody has clicked, so
     the machine starts with its power button. */
  #off { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
         justify-content: center; gap: 22px; background: #000; color: #b6b6b6; font: 16px monospace; }
  #off.ready { display: flex; }
  #off h1 { margin: 0; font: bold 28px monospace; color: #fff; letter-spacing: 2px; }
  #power { width: 84px; height: 84px; border-radius: 50%; cursor: pointer; background: #b6b6b6;
           border: 3px solid; border-color: #fff #494949 #494949 #fff; position: relative; }
  #power:active { border-color: #494949 #fff #fff #494949; }
  /* The mark on it: a ring open at the top, and a bar through the gap. */
  #power::before { content: ""; position: absolute; left: 22px; top: 24px; width: 28px; height: 28px;
                   border: 5px solid #242424; border-top-color: transparent; border-radius: 50%; }
  #power::after { content: ""; position: absolute; left: 39px; top: 16px; width: 6px; height: 24px;
                  background: #242424; }
  #note { position: fixed; left: 0; right: 0; top: 45%; text-align: center; color: #b6b6b6;
          font: 16px monospace; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="note">Starting Chinchilla...</div>
<div id="off">
  <h1>Chinchilla</h1>
  <button id="power" type="button" aria-label="Power" autofocus></button>
  <div>Press the power button</div>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    // The program is ready: the power button shows (the program waits for it).
    onRuntimeInitialized: function () {
      document.getElementById('note').remove();
      var off = document.getElementById('off');
      if (off) { off.className = 'ready'; document.getElementById('power').focus(); }
    },
    printErr: function (text) { console.warn(text); },
    onAbort: function () {
      var note = document.createElement('div');
      note.id = 'note';
      note.textContent = 'Chinchilla stopped. Load the page again to restart it.';
      document.body.appendChild(note);
    }
  };
  // Start > Shut Down > Restart loads the page again: the machine was on,
  // so it comes back on without the button. (Sound then waits for the
  // first click or key, as the browser demands.)
  try {
    if (sessionStorage.getItem('chinchilla-restart')) {
      sessionStorage.removeItem('chinchilla-restart');
      document.getElementById('off').remove();
    }
  } catch (error) { /* no session storage: the button shows */ }
  // Keys go to Chinchilla as soon as the page is clicked.
  window.addEventListener('load', function () { Module.canvas.focus(); });
  Module.canvas.addEventListener('mousedown', function () { Module.canvas.focus(); });
</script>
{{{ SCRIPT }}}
</body>
</html>
